      ChevronDown: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>,

      Loader: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>,
      AlertTriangle: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0L2.27 18a2 2 0 0 0 1.73 3h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>,

      Dollar: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>,
      TrendingUp: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
      Check: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
      Cloud: (p) => <svg {...p} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19c0-3.037-2.463-5.5-5.5-5.5S6.5 15.963 6.5 19"/><path d="M20.61 19a5.5 5.5 0 0 0-9.11-6"/><path d="M18.5 13A5.5 5.5 0 0 0 9 12.5"/><path d="M11 10.5a5.5 5.5 0 0 0-11 0"/></svg>
    };

    // --- DATOS Y CONSTANTES DEL ANOTADOR ---
    const SIZES = [{id:0,label:'Sedan'},{id:1,label:'Troca'},{id:2,label:'Bitroca'},{id:3,label:'Bitroca2'}];
    const SERVICES = [{name:'Regular',base:9,step:1},{name:'Cera',base:18,step:3},{name:'Shampoo',base:21,step:3},{name:'Full (Cera+Shampoo)',base:36,step:6},{name:'Clay Wax',base:33,step:3},{name:'Clay Wax Full',base:39,step:15},{name:'Solo Extra / Varios',base:0,step:0}];
    const COLORS = [{name:"Blanco",hex:"#FFFFFF",border:true},{name:"Negro",hex:"#000000"},{name:"Gris",hex:"#6B7280"},{name:"Plata",hex:"#C0C0C0"},{name:"Gris Mate",hex:"#374151"},{name:"Rojo",hex:"#EF4444"},{name:"Rojo Oscuro",hex:"#7F1D1D"},{name:"Azul",hex:"#3B82F6"},{name:"Azul Oscuro",hex:"#1E3A8A"},{name:"Verde",hex:"#10B981"},{name:"Amarillo",hex:"#EAB308"},{name:"Naranja",hex:"#F97316"},{name:"Beige",hex:"#F5F5DC",border:true},{name:"Marrón",hex:"#78350F"},{name:"Morado",hex:"#9333EA"},{name:"Rosa",hex:"#EC4899"},{name:"Otro",hex:"transparent",border:true,icon:true}];
    const BRANDS = [{name:'Tesla',slug:'tesla'},{name:'Toyota',slug:'toyota'},{name:'Honda',slug:'honda'},{name:'Nissan',slug:'nissan'},{name:'Ford',slug:'ford'},{name:'Chevrolet',slug:'chevrolet'},{name:'Cadillac',slug:'cadillac'},{name:'Buick',slug:'buick'},{name:'GMC',slug:'generalmotors'},{name:'Ram',slug:'ram'},{name:'Jeep',slug:'jeep'},{name:'Dodge',slug:'dodge'},{name:'Lincoln',slug:'lincoln'},{name:'Porsche',slug:'porsche'},{name:'BMW',slug:'bmw'},{name:'Mercedes',slug:'mercedes'},{name:'Audi',slug:'audi'},{name:'Lexus',slug:'lexus'},{name:'Acura',slug:'acura'},{name:'Infiniti',slug:'infiniti'},{name:'Rivian',slug:'rivian'},{name:'Lucid',slug:'lucid'},{name:'Land Rover',slug:'landrover'},{name:'Jaguar',slug:'jaguar'},{name:'Volvo',slug:'volvo'},{name:'Mini',slug:'mini'},{name:'Aston Martin',slug:'astonmartin'},{name:'Maserati',slug:'maserati'},{name:'Alfa Romeo',slug:'alfaromeo'},{name:'Kia',slug:'kia'},{name:'Hyundai',slug:'hyundai'},{name:'Mazda',slug:'mazda'},{name:'Volkswagen',slug:'volkswagen'},{name:'Subaru',slug:'subaru'},{name:'Mitsubishi',slug:'mitsubishi'},{name:'Fiat',slug:'fiat'},{name:'Lamborghini',slug:'lamborghini'},{name:'Ferrari',slug:'ferrari'},{name:'McLaren',slug:'mclaren'},{name:'Bugatti',slug:'bugatti'},{name:'Rolls-Royce',slug:'rollsroyce'},{name:'Bentley',slug:'bentley'},{name:'Otro',slug:null}];

    const getBrandSlug = (name) => { const found = BRANDS.find(b => b.name === name); return found ? found.slug : null; };
    const getColorHex = (name) => { const found = COLORS.find(c => c.name === name); return found ? found : { hex: '#ccc', border: true }; };
    const ColorDot = ({ colorName }) => { const color = getColorHex(colorName); return (<div className={`w-4 h-4 rounded-full shadow-sm flex-shrink-0 ${color.border ? 'border border-gray-300' : ''}`} style={{ backgroundColor: color.hex }} title={colorName}>{color.icon && <span className="flex items-center justify-center w-full h-full text-[8px] text-gray-500">?</span>}</div>); };

    // ==========================================
    // CONFIGURACIÓN DE FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyCyv1h_L-FxjxcY_Dnj1mOR9ExNf1ePsk0",
      authDomain: "carwash-pro-c139d.firebaseapp.com",
      projectId: "carwash-pro-c139d",
      storageBucket: "carwash-pro-c139d.firebasestorage.app",
      messagingSenderId: "395477116926",
      appId: "1:395477116926:web:9c124bcd8d05fe91a182af",
      measurementId: "G-F5NZK179MQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = "autowash-pro-v1";



    // --- COMPONENTES COMUNES
    const LoginScreen = () => {
      const [isRegistering, setIsRegistering] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          if (isRegistering) await createUserWithEmailAndPassword(auth, email, password);
          else await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          if(err.code === 'auth/invalid-credential') setError("Datos incorrectos");
          else if(err.code === 'auth/email-already-in-use') setError("Correo ya registrado");
          else if(err.code === 'auth/weak-password') setError("Contraseña débil");
          else setError("Error: " + err.message);
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
          <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm">
            <div className="flex justify-center mb-6 text-blue-900"><Icons.Car size={60} /></div>
            <h1 className="text-2xl font-bold text-center mb-2 text-gray-800">AutoWash App</h1>
            <p className="text-center text-gray-500 mb-6 text-sm">{isRegistering ? 'Crear cuenta' : 'Iniciar sesión'}</p>
            <form onSubmit={handleAuth} className="space-y-4">
              <div><label className="block text-xs font-bold text-gray-500 mb-1">CORREO</label><div className="relative"><Icons.User className="absolute left-3 top-2.5 text-gray-400" size={18}/><input type="email" required className="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="tu@email.com" value={email} onChange={e=>setEmail(e.target.value)}/></div></div>
              <div><label className="block text-xs font-bold text-gray-500 mb-1">CONTRASEÑA</label><div className="relative"><Icons.Lock className="absolute left-3 top-2.5 text-gray-400" size={18}/><input type="password" required className="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="******" value={password} onChange={e=>setPassword(e.target.value)}/></div></div>
              {error && <div className="text-red-500 text-xs bg-red-50 p-2 rounded text-center">{error}</div>}
              <button type="submit" disabled={loading} className="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-blue-800 transition shadow-lg disabled:opacity-50">{loading?'...': (isRegistering? 'Registrar': 'Entrar')}</button>
            </form>
            <div className="mt-6 text-center border-t pt-4"><button onClick={()=>setIsRegistering(!isRegistering)} className="text-sm text-blue-600 font-semibold hover:underline">{isRegistering? '¿Ya tienes cuenta?' : '¿Nuevo usuario? Crear cuenta'}</button></div>
          </div>
        </div>
      );
    };

    const BrandSelect = ({ value, onChange }) => {
      const [isOpen, setIsOpen] = useState(false);
      const selectedBrand = BRANDS.find(b => b.name === value) || BRANDS[BRANDS.length - 1];
      return (
        <div className="relative w-full">
          <label className="block text-xs font-semibold text-gray-500 mb-1 uppercase tracking-wider">Marca</label>
          <button onClick={() => setIsOpen(!isOpen)} className="w-full bg-white border border-gray-300 rounded-md py-2 px-3 flex items-center justify-between shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-left">
            <div className="flex items-center gap-2">
              {selectedBrand.slug ? <img src={`https://cdn.simpleicons.org/${selectedBrand.slug}`} alt="" className="w-5 h-5 opacity-70" onError={(e) => e.target.style.display = 'none'} /> : <Icons.Car className="w-5 h-5 text-gray-400" />}
              <span className="text-gray-800 font-medium">{selectedBrand.name}</span>
            </div>
            <Icons.ChevronDown size={16} className="text-gray-400" />
          </button>
          {isOpen && (
            <div className="absolute z-20 w-full mt-1 bg-white border border-gray-200 rounded-md shadow-lg max-h-60 overflow-auto">
              {BRANDS.map((brand) => (
                <div key={brand.name} onClick={() => { onChange(brand.name); setIsOpen(false); }} className="flex items-center gap-3 px-4 py-2 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0">
                  {brand.slug ? <img src={`https://cdn.simpleicons.org/${brand.slug}`} alt={brand.name} className="w-5 h-5" /> : <Icons.Car size={20} className="text-gray-400" />}
                  <span className="text-sm text-gray-700">{brand.name}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    // --- APP PRINCIPAL
    const CarWashApp = () => {
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [currentView, setCurrentView] = useState('anotador'); 
      const [isMenuOpen, setIsMenuOpen] = useState(false);
      const [errorMsg, setErrorMsg] = useState('');

      // --- ESTADOS ANOTADOR
      const [currentCars, setCurrentCars] = useState([]);
      const [history, setHistory] = useState([]);
      const [isSavingAnotador, setIsSavingAnotador] = useState(false);
      const [confirmClose, setConfirmClose] = useState(false);
      const [deleteConfirmId, setDeleteConfirmId] = useState(null);
      const [clearSessionConfirm, setClearSessionConfirm] = useState(false);
      const [clearHistoryConfirm, setClearHistoryConfirm] = useState(false);
      const [selectedDay, setSelectedDay] = useState(null);
      const [formData, setFormData] = useState({ brand: 'Tesla', color: '', sizeId: 0, serviceIndex: 0, hasExtra: false, extraAmount: '', extraNote: '' });

      // --- ESTADOS TRACKER (GANANCIAS)
      const initialWeekState = [
        { day: 'Lunes', hours: '', production: '', tips: '' },
        { day: 'Martes', hours: '', production: '', tips: '' },
        { day: 'Miércoles', hours: '', production: '', tips: '' },
        { day: 'Jueves', hours: '', production: '', tips: '' },
        { day: 'Viernes', hours: '', production: '', tips: '' },
        { day: 'Sábado', hours: '', production: '', tips: '' },
        { day: 'Domingo', hours: '', production: '', tips: '' },
      ];
      const [currentWeek, setCurrentWeek] = useState(initialWeekState);
      const [trackerHistory, setTrackerHistory] = useState([]);
      const [showTrackerHistory, setShowTrackerHistory] = useState(false);
      const [savingTracker, setSavingTracker] = useState(false);
      const [modalConfig, setModalConfig] = useState({ isOpen: false, type: null, data: null });
      const saveTimeoutRef = useRef(null);

      // --- AUTH EFFECT
      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          setUser(currentUser);
          setAuthLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // --- DATA EFFECTS
      useEffect(() => {
        if (!user) { setCurrentCars([]); setHistory([]); setCurrentWeek(initialWeekState); setTrackerHistory([]); return; }
        
        // 1. ANOTADOR DATA
        const unsubCars = onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'data', 'current_session'), (snap) => { setCurrentCars(snap.exists() ? snap.data().list || [] : []); });
        const unsubHistory = onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'history_records'), (snap) => {
            const loaded = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            setHistory(loaded.sort((a, b) => new Date(b.isoDate) - new Date(a.isoDate)));

                {/* Tabla Input */}
                <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                    <div className="grid grid-cols-4 bg-slate-100 p-2 text-xs font-bold text-slate-600 text-center border-b">
                        <div className="text-left pl-2">Día</div><div>Hrs</div><div>$$ Prod</div><div>$$ Tips</div>
                    </div>
                    {currentWeek.map((day, index) => (
                        <div key={index} className="grid grid-cols-4 border-b last:border-0 items-center p-1 hover:bg-slate-50 transition-colors">
                            <div className="pl-3 text-sm font-medium text-slate-700">{day.day.substring(0, 3)}</div>
                            <div className="p-1"><input type="number" placeholder="0" className="w-full text-center bg-blue-50 border border-blue-100 rounded focus:outline-none focus:border-blue-400 text-sm py-1" value={day.hours} onChange={(e) => handleTrackerInput(index, 'hours', e.target.value)} /></div>
                            <div className="p-1"><input type="number" placeholder="$0" className="w-full text-center bg-green-50 border border-green-100 rounded focus:outline-none focus:border-green-400 text-sm py-1" value={day.production} onChange={(e) => handleTrackerInput(index, 'production', e.target.value)} /></div>
                            <div className="p-1"><input type="number" placeholder="$0" className="w-full text-center bg-orange-50 border border-orange-100 rounded focus:outline-none focus:border-orange-400 text-sm py-1" value={day.tips} onChange={(e) => handleTrackerInput(index, 'tips', e.target.value)} /></div>
                        </div>
                    ))}
                </div>

                {/* Botón Cerrar */}
                <div className="space-y-3">
                    <button disabled={totalPay === 0} onClick={() => setModalConfig({ isOpen: true, type: 'save' })} className={`w-full py-4 rounded-xl shadow-lg font-bold text-lg flex items-center justify-center gap-2 transition-all ${totalPay === 0 ? 'bg-slate-300 text-slate-500 cursor-not-allowed' : 'bg-slate-800 text-white hover:bg-slate-700 active:scale-95'}`}>
                        <Icons.Save size={20} /> {totalPay === 0 ? 'NO HAY DATOS' : 'CERRAR SEMANA'}
                    </button>
                    <button onClick={() => setShowTrackerHistory(true)} className="w-full py-3 text-blue-600 font-medium text-sm hover:underline flex items-center justify-center gap-1">
                        <Icons.History size={16} /> Ver Historial de Pagos
                    </button>
                </div>
                </>
                ) : (
                    /* HISTORIAL TRACKER */
                    <div className="space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-300">
                        <button onClick={() => setShowTrackerHistory(false)} className="mb-2 text-sm text-blue-600 flex items-center gap-1"><Icons.ChevronDown className="rotate-90" size={16}/> Volver a Calculadora</button>
                        <h3 className="font-bold text-slate-700 flex items-center gap-2 mt-2"><Icons.Calendar size={18} /> Pagos Guardados</h3>
                        {!trackerHistory.length ? (
                            <div className="text-center p-8 text-slate-400 bg-white rounded-xl border border-dashed border-slate-300">No hay semanas guardadas aún.</div>
                        ) : (
                            <div className="space-y-3">
                                {trackerHistory.map((item) => (
                                    <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 relative">
                                        <button onClick={() => setModalConfig({ isOpen: true, type: 'delete', data: item.id })} className="absolute top-4 right-4 text-slate-300 hover:text-red-500 transition-colors"><Icons.Trash2 size={16} /></button>
                                        <div className="text-xs text-slate-500 font-bold uppercase mb-1">{item.date}</div>
                                        <div className="flex justify-between items-end mb-2">
                                            <div className="text-2xl font-bold text-green-600">${item.total.toLocaleString()}</div>
                                            <div className="text-xs bg-slate-100 px-2 py-1 rounded text-slate-500">Ganó: <span className="font-bold">{item.winner}</span></div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 text-xs text-slate-500 pt-2 border-t border-slate-100">
                                            <div><span className="block font-bold">Horas</span>{item.hours.toFixed(1)} ($ {item.hoursValue})</div>
                                            <div><span className="block font-bold">Prod.</span>${item.production}</div>
                                            <div><span className="block font-bold">Tips</span>${item.tips}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}
              </div>
            )}

            {/* MODALES DETALLE DIARIO (Anotador) */}
            {selectedDay && currentView === 'anotador' && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm fade-in">
                    <div className="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col max-h-[90vh]">
                        <div className="bg-blue-900 text-white p-4 flex justify-between items-center"><div><h3 className="font-bold text-lg">Detalles</h3><p className="text-blue-200 text-xs">{selectedDay.date}</p></div><button onClick={() => setSelectedDay(null)}><Icons.X size={24} /></button></div>
                        <div className="overflow-y-auto p-0 flex-1 bg-gray-50"><ul className="divide-y divide-gray-100">{selectedDay.details?.map((c, i) => (<li key={i} className="p-3 bg-white flex justify-between"><div className="flex gap-3"><div className="mt-1 flex-shrink-0">{getBrandSlug(c.brand) ? <img src={`https://cdn.simpleicons.org/${getBrandSlug(c.brand)}`} className="w-5 h-5 opacity-70"/> : <Icons.Car size={16} className="text-gray-400"/>}</div><div><div className="font-bold text-gray-800 text-sm">{c.brand}</div><div className="text-xs text-gray-500 flex items-center gap-1"><ColorDot colorName={c.color} /> {c.color} • {c.sizeLabel}</div><div className="text-xs text-blue-600 font-medium">{c.serviceName}</div></div></div><div className="text-right"><div className="font-bold text-gray-700">${c.price}</div>{c.extraPrice > 0 && <div className="text-[10px] text-purple-600 flex items-center justify-end gap-1"><Icons.Sparkles size={10}/> {c.extraLabel} : +${c.extraPrice}</div>}<div className="text-[10px] text-gray-400 flex items-center justify-end gap-1"><Icons.Clock size={10}/> {c.timestamp}</div></div></li>))}</ul></div>
                    </div>
                </div>
            )}

            {/* MODALES CONFIRMACION (Tracker) */}
            {modalConfig.isOpen && (
                <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                    <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
                        <h3 className="text-xl font-bold mb-2 text-slate-800">{modalConfig.type === 'save' ? '¿Cerrar Semana?' : '¿Borrar Registro?'}</h3>
                        <p className="text-slate-600 mb-6 text-sm leading-relaxed">{modalConfig.type === 'save' ? 'Esto limpiará la tabla actual y guardará tus ganancias. ¿Seguro que terminaste?' : 'Esta acción borrará este registro del historial permanentemente.'}</p>
                        <div className="flex gap-3">
                            <button onClick={() => setModalConfig({ isOpen: false, type: null, data: null })} className="flex-1 py-3 bg-slate-100 font-bold text-slate-600 rounded-xl hover:bg-slate-200 flex items-center justify-center gap-2"><Icons.X size={18} /> Cancelar</button>
                            <button onClick={handleConfirmTrackerAction} className={`flex-1 py-3 font-bold text-white rounded-xl shadow-lg flex items-center justify-center gap-2 ${modalConfig.type === 'save' ? 'bg-blue-600 hover:bg-blue-700' : 'bg-red-500 hover:bg-red-600'}`}><Icons.Check size={18} /> {modalConfig.type === 'save' ? 'Confirmar' : 'Borrar'}</button>
                        </div>
                    </div>
                </div>
            )}

          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<CarWashApp />);
  </script>
</body>
</html>
